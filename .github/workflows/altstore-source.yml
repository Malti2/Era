name: Update AltStore Source

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altstore-source
  cancel-in-progress: true

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate source from GitHub Releases
        run: python3 Scripts/update-altstore-source.py
      - name: Validate source schema and release assets
        run: |
          python3 Scripts/validate-altstore-source.py docs/source.json
          python3 - <<'PY'
          import json, urllib.request
          with open('docs/source.json') as f: source = json.load(f)
          for version in source['apps'][0]['versions']:
              req = urllib.request.Request(version['downloadURL'], method='HEAD', headers={'User-Agent':'Era-AltStore-Source-CI'})
              with urllib.request.urlopen(req) as response:
                  assert response.status == 200, version['downloadURL']
          PY
      - name: Commit updated source
        run: |
          if git diff --quiet -- docs/source.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/source.json
          git commit -m "Update AltStore source for ${{ github.event.release.tag_name || 'manual run' }}"
          git push origin HEAD:main
