name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: Era
          options:
            bundlePrefix: com.malte
            deploymentTarget:
              iOS: "16.0"
          targets:
            Era:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources/Era
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.malte.Era
                MARKETING_VERSION: "1.0"
                CURRENT_PROJECT_VERSION: "1"
                GENERATE_INFOPLIST_FILE: YES
                CODE_SIGNING_ALLOWED: NO
          EOF
          xcodegen generate

      - name: Build with xcodebuild
        run: |
          xcodebuild -project Era.xcodeproj -scheme Era -sdk iphoneos -configuration Release -derivedDataPath derivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find derivedData/Build/Products/Release-iphoneos -name "Era.app" | head -n 1)
          echo "Found App Bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Era.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Era-IPA
          path: Era.ipa
