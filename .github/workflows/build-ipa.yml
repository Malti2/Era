name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift installation
        run: swift --version
      - name: Build the Swift package for iOS
        run: swift build -c release -Xswiftc -target -Xswiftc arm64-apple-ios18.0
