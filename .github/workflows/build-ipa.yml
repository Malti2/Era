name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build with xcodebuild
        run: |
          xcodebuild -scheme Era -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath derivedData CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          echo "Searching for build products..."
          find derivedData/Build/Products -maxdepth 3
          
          APP_PATH=$(find derivedData/Build/Products -name "Era.app" -o -name "Era" | head -n 1)
          echo "Found product: $APP_PATH"
          
          mkdir -p Payload/Era.app
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH/" Payload/Era.app/
          elif [ -f "$APP_PATH" ]; then
            cp "$APP_PATH" Payload/Era.app/Era
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleExecutable</key>\n    <string>Era</string>\n    <key>CFBundleIdentifier</key>\n    <string>com.malte.Era</string>\n    <key>CFBundleName</key>\n    <string>Era</string>\n    <key>CFBundlePackageType</key>\n    <string>APPL</string>\n    <key>CFBundleShortVersionString</key>\n    <string>1.0</string>\n    <key>CFBundleVersion</key>\n    <string>1</string>\n    <key>LSRequiresIPhoneOS</key>\n    <true/>\n</dict>\n</plist>\n' > Payload/Era.app/Info.plist
          else
            echo "Error: No product found!"
            exit 1
          fi
          
          zip -r Era.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Era-IPA
          path: Era.ipa
