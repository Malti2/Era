name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift installation
        run: swift --version
      - name: Generate Xcode project from Swift package
        run: swift package generate-xcodeproj
      - name: Build iOS app archive
        run: |
          xcodebuild -scheme Era -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release clean build
