name: Era
options:
  bundleIdPrefix: de.malte
  deploymentTarget: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Era:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources, Shared]
    dependencies:
      - target: EraShareExtension
        embed: true
      - target: EraWidgetsExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.era
        PRODUCT_NAME: Era
        MARKETING_VERSION: "27.6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Era.entitlements
        CODE_SIGNING_ALLOWED: NO
  EraShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [ShareExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.era.share
        PRODUCT_NAME: EraShareExtension
        MARKETING_VERSION: "27.6.0"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGNING_ALLOWED: NO
  EraWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [EraWidgets, Shared, Sources/Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.era.widgets
        PRODUCT_NAME: EraWidgetsExtension
        MARKETING_VERSION: "27.6.0"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EraWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: EraWidgets/EraWidgetsExtension.entitlements
        CODE_SIGNING_ALLOWED: NO
schemes:
  Era:
    build:
      targets:
        Era: all
        EraShareExtension: all
        EraWidgetsExtension: all
